<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>FORCE Remote Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:#16181c;color:#e6e6e6;
 display:flex;flex-direction:column;height:100vh}
header{padding:8px 12px;background:#0e0f12;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
header b{margin-right:10px;color:#ff5a36}
header .gap{flex:1}
header .sep{width:1px;height:22px;background:#3a3f4a;margin:0 4px}
button{background:#2a2e36;color:#e6e6e6;border:1px solid #3a3f4a;border-radius:4px;
 padding:6px 10px;cursor:pointer;font:inherit}
button:hover{background:#353a45}button:disabled{opacity:.4;cursor:default}
button.danger{border-color:#7a2e2e}
button.go{background:#ff5a36;border-color:#ff5a36;color:#111;font-weight:600}
main{flex:1;display:flex;gap:8px;padding:8px;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;border:2px solid #2a2e36;border-radius:6px;min-width:0}
.pane.active{border-color:#ff5a36}
.nav{display:flex;gap:4px;align-items:center;padding:5px 6px;background:#1e2127}
.nav button{padding:3px 8px;font-size:13px}
.crumbs{flex:1;min-width:0;font-family:monospace;font-size:13px;margin-left:6px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.crumbs bdi{direction:ltr}
.crumbs a{color:#e6e6e6;cursor:pointer;text-decoration:none;padding:1px 2px;border-radius:3px}
.crumbs a:hover{background:#353a45;color:#ff5a36}
.crumbs .s{color:#666;margin:0 2px}
.list{flex:1;overflow:auto}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 70px 80px 130px;gap:8px;
 padding:5px 8px;white-space:nowrap;user-select:none}
.cols{background:#1a1d22;color:#9aa;font-size:12px;border-bottom:1px solid #2a2e36}
.cols span{cursor:pointer}.cols span:hover{color:#e6e6e6}
.cols span.on{color:#ff5a36}
.row{cursor:pointer}
.row span{overflow:hidden;text-overflow:ellipsis}
.row .num,.cols .num{text-align:right}
.row .meta{color:#9aa;font-size:13px}
.row:hover{background:#22262d}.row.sel{background:#5a2a1e}
.row.dir .nm{font-weight:600}.row.cut{opacity:.45}
#clip{color:#aaa;font-size:13px}
footer{padding:6px 12px;background:#0e0f12;min-height:30px;white-space:pre-wrap}
footer.err{color:#ff8a7a}
#login{position:fixed;inset:0;background:#16181c;display:none;align-items:center;justify-content:center}
#login form{background:#1e2127;padding:24px;border-radius:8px;width:340px;display:flex;
 flex-direction:column;gap:10px}
#login h2{margin:0 0 4px;color:#ff5a36}
#login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#aaa}
#login input{padding:8px;border-radius:4px;border:1px solid #3a3f4a;background:#16181c;
 color:#e6e6e6;font:inherit}
#loginmsg{color:#ff8a7a;min-height:18px;white-space:pre-wrap}
</style></head><body>
<header><b>FORCE Remote Browser</b>
<button id="selall" title="Ctrl+A">Select all</button>
<button id="copy" title="Ctrl+C">Copy</button>
<button id="cut" title="Ctrl+X">Cut</button>
<button id="paste" title="Ctrl+V">Paste</button>
<span class="sep"></span>
<button id="rename" title="F2">Rename</button>
<button id="mkdir">New folder</button>
<button id="delete" class="danger" title="Delete">Delete</button>
<button id="refresh" title="F5">Refresh</button>
<span id="clip"></span>
<span class="gap"></span>
<button id="other">Change Force</button>
</header>
<main><div class="pane" id="p0"><div class="nav"><button class="back" title="Back (Backspace)">◀ Back</button><button class="up" title="Up one level (Alt+Up)">▲ Up</button><button class="open" title="Open selected folder (Enter)">Open</button><div class="crumbs"></div></div><div class="cols"></div><div class="list"></div></div>
<div class="pane" id="p1"><div class="nav"><button class="back" title="Back (Backspace)">◀ Back</button><button class="up" title="Up one level (Alt+Up)">▲ Up</button><button class="open" title="Open selected folder (Enter)">Open</button><div class="crumbs"></div></div><div class="cols"></div><div class="list"></div></div></main>
<footer id="status">Left: your Force. Right: this PC. Copy or cut on one side, then Paste on the other.</footer>
<div id="login"><form id="loginform">
<h2>Connect to your Force</h2>
<label>IP address of the Force<input id="host" placeholder="e.g. 192.168.1.50" required></label>
<label>User<input id="user" value="root"></label>
<label>Password (leave empty if there is none)<input id="password" type="password"></label>
<label>Folder that holds the drives<input id="root" value="/media"></label>
<div id="loginmsg"></div>
<button class="go" type="submit">Connect</button>
</form></div>
<script>
const TOKEN="__TOKEN__";
// Left pane: the Force's drives. Right pane: this computer's drives.
const SIDES=[{side:'force',root:'/media',label:'Force'},{side:'pc',root:'/',label:'This PC'}];
const panes=SIDES.map((s,i)=>({el:document.getElementById('p'+i),side:s.side,root:s.root,label:s.label,path:s.root,
  items:[],sel:new Set(),sort:'name',asc:true,history:[]}));
let active=0;
let clip=null; // {op:'copy'|'move', side:'force'|'pc', paths:[...]}
const $=id=>document.getElementById(id);
const status=$('status');
function say(t,err){status.textContent=t;status.className=err?'err':'';}
function busy(b){document.querySelectorAll('button').forEach(x=>x.disabled=b);if(!b)updateClip();}
async function api(body){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},
    body:JSON.stringify(body)});
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
const join=(a,b)=>a.replace(/\/$/,'')+'/'+b;
const parent=p=>p.replace(/\/[^\/]+$/,'')||'/';
const plural=n=>n+' item'+(n===1?'':'s');
function updateClip(){
  $('paste').disabled=!clip;
  $('clip').textContent=clip?(plural(clip.paths.length)+(clip.op==='move'?' cut':' copied')+', ready to paste'):'';
}
const COLS=[['name','Name',''],['type','Type',''],['size','Size','num'],['modified','Date modified','']];
function ext(it){if(it.drive)return 'Drive';if(it.dir)return 'Folder';const m=/\.([^.]+)$/.exec(it.name);return m&&m.index>0?m[1].toUpperCase():'';}
function fmtSize(n){if(n<0)return '';if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return (n<10?n.toFixed(1):Math.round(n))+' '+u[i];}
function fmtDate(t){if(!t)return '';const d=new Date(t*1000),z=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
function sorted(p){
  const k=p.sort,dir=p.asc?1:-1,name=(a,b)=>a.name.toLowerCase()<b.name.toLowerCase()?-1:a.name.toLowerCase()>b.name.toLowerCase()?1:0;
  return [...p.items].sort((a,b)=>{
    if(a.dir!==b.dir) return a.dir?-1:1; // folders first
    let c=0;
    if(k==='type') c=ext(a).localeCompare(ext(b));
    else if(k==='size') c=a.size-b.size;
    else if(k==='modified') c=a.modified-b.modified;
    return (c||name(a,b))*dir;
  });
}
function cell(text,cls){const s=document.createElement('span');s.textContent=text;if(cls)s.className=cls;return s;}
function render(i){
  const p=panes[i];
  p.el.classList.toggle('active',i===active);
  renderNav(i);
  const head=p.el.querySelector('.cols'); head.textContent='';
  for(const [k,label,cls] of COLS){
    const h=cell(label+(p.sort===k?(p.asc?' ▲':' ▼'):''),(cls+(p.sort===k?' on':'')).trim());
    h.onclick=e=>{e.stopPropagation();active=i;if(p.sort===k)p.asc=!p.asc;else{p.sort=k;p.asc=k==='name'||k==='type';}renderAll();};
    head.appendChild(h);
  }
  const list=p.el.querySelector('.list'); list.textContent='';
  const row=(cells,cls,click,dbl)=>{const d=document.createElement('div');d.className='row '+cls;
    cells.forEach(c=>d.appendChild(c));
    d.onclick=e=>{e.stopPropagation();click();};if(dbl)d.ondblclick=e=>{e.stopPropagation();dbl();};list.appendChild(d);};
  if(p.path!==p.root) row([cell('⬆ ..','nm')],'dir',()=>{active=i;up(i);});
  for(const it of sorted(p)){
    const full=join(p.path,it.name);
    const isCut=clip&&clip.op==='move'&&clip.side===p.side&&clip.paths.includes(full);
    row([cell((it.drive?'💽 ':it.dir?'📁 ':'')+it.name,'nm'),cell(ext(it),'meta'),cell(it.dir?'':fmtSize(it.size),'meta num'),
         cell(fmtDate(it.modified),'meta')],
      (it.dir?'dir ':'')+(p.sel.has(it.name)?'sel ':'')+(isCut?'cut':''),
      ()=>{active=i;p.sel.has(it.name)?p.sel.delete(it.name):p.sel.add(it.name);renderAll();},
      it.dir?()=>{active=i;go(i,full);}:null);
  }
}
panes.forEach((p,i)=>p.el.addEventListener('click',()=>{if(active!==i){active=i;renderAll();}}));
function renderAll(){render(0);render(1);}
async function load(i,path){
  const p=panes[i];
  let ok=false;
  try{const r=await api({op:'list',side:p.side,path:path||p.path});p.path=r.path;p.items=r.items;p.sel=new Set();ok=true;}
  catch(e){say(e.message,true);}
  renderAll();
  return ok;
}
// Folder navigation: go() remembers where you came from, so Back can return there.
async function go(i,path){
  const p=panes[i], from=p.path;
  if(path===from) return;
  if(await load(i,path)){p.history.push(from);if(p.history.length>100)p.history.shift();renderAll();}
}
async function back(i){
  const p=panes[i];
  if(!p.history.length) return say('Nothing to go back to in this pane.',true);
  await load(i,p.history.pop());
}
function up(i){const p=panes[i];if(p.path===p.root)return say('You are already at the top level.',true);go(i,parent(p.path));}
function openSel(i){
  const p=panes[i], dirs=p.items.filter(it=>it.dir&&p.sel.has(it.name));
  if(p.sel.size!==1||dirs.length!==1) return say('Select one folder to open.',true);
  go(i,join(p.path,dirs[0].name));
}
function renderNav(i){
  const p=panes[i], nav=p.el.querySelector('.nav');
  nav.querySelector('.back').disabled=!p.history.length;
  nav.querySelector('.up').disabled=p.path===p.root;
  const c=nav.querySelector('.crumbs'); c.textContent='';
  const b=document.createElement('bdi'); c.appendChild(b);
  const link=(label,path)=>{const a=document.createElement('a');a.textContent=label;a.title=path;
    a.onclick=e=>{e.stopPropagation();active=i;go(i,path);};b.appendChild(a);};
  link(p.label,p.root);
  const rest=p.path.startsWith(p.root)?p.path.slice(p.root.length).split('/').filter(Boolean):[];
  let acc=p.root;
  for(const part of rest){
    acc=join(acc,part);
    const s=document.createElement('span');s.className='s';s.textContent='›';b.appendChild(s);
    link(part,acc);
  }
}
panes.forEach((p,i)=>{
  const nav=p.el.querySelector('.nav');
  nav.querySelector('.back').onclick=e=>{e.stopPropagation();active=i;back(i);};
  nav.querySelector('.up').onclick=e=>{e.stopPropagation();active=i;up(i);};
  nav.querySelector('.open').onclick=e=>{e.stopPropagation();active=i;openSel(i);};
  // the "back" button on a mouse
  p.el.addEventListener('mouseup',e=>{if(e.button===3){e.preventDefault();active=i;back(i);}});
});
function picked(){const p=panes[active];return [...p.sel].map(n=>join(p.path,n));}
async function act(body,done,working){
  busy(true);say(working||'Working…');
  let ok=false;
  try{const r=await api(body);
    if(r.errors&&r.errors.length) say('Not everything worked:\n'+r.errors.join('\n'),true); else {say(done);ok=true;}}
  catch(e){say(e.message,true);}
  busy(false);await load(0);await load(1);
  return ok;
}
function toClip(op){
  const src=picked(); if(!src.length) return say('Select something first.',true);
  clip={op,side:panes[active].side,paths:src};
  panes[active].sel=new Set();
  updateClip();renderAll();
  say(plural(src.length)+(op==='move'?' cut':' copied')+'. Open the folder where they should go and click Paste.');
}
async function paste(){
  if(!clip) return say('Copy or cut something first.',true);
  const dp=panes[active], dest=dp.path, c=clip;
  const working=c.side===dp.side?'':(c.side==='pc'?'Sending to the Force':'Copying to this PC')+'… large files can take a while.';
  const ok=await act({op:c.op,srcSide:c.side,sources:c.paths,destSide:dp.side,dest},
    plural(c.paths.length)+' pasted into '+dp.label+' '+dest+'.',working);
  if(c.op==='move'){clip=null;updateClip();renderAll();} // cut items can only be pasted once
  return ok;
}
function rename(){
  const p=panes[active]; if(p.sel.size!==1) return say('Select exactly one item to rename.',true);
  const old=[...p.sel][0], name=prompt('New name:',old);
  if(name&&name!==old) act({op:'rename',side:p.side,path:join(p.path,old),name},'Renamed.');
}
function del(){
  const src=picked(); if(!src.length) return say('Select something first.',true);
  if(confirm('Permanently delete '+plural(src.length)+'? This cannot be undone.\n\n'+src.join('\n')))
    act({op:'delete',side:panes[active].side,paths:src},'Deleted.');
}
function selectAll(){
  const p=panes[active];
  p.sel=p.sel.size===p.items.length&&p.items.length?new Set():new Set(p.items.map(it=>it.name));
  renderAll();
  say(p.sel.size?plural(p.sel.size)+' selected.':'Selection cleared.');
}
$('selall').onclick=selectAll;
$('copy').onclick=()=>toClip('copy');
$('cut').onclick=()=>toClip('move');
$('paste').onclick=paste;
$('rename').onclick=rename;
$('mkdir').onclick=()=>{
  const name=prompt('Name of the new folder:');
  if(name) act({op:'mkdir',side:panes[active].side,path:panes[active].path,name},'Folder created.');
};
$('delete').onclick=del;
$('refresh').onclick=()=>{load(0);load(1);};
$('other').onclick=()=>showLogin('');
document.addEventListener('keydown',e=>{
  if($('login').style.display==='flex'||e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase(), ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&k==='a'){e.preventDefault();selectAll();}
  else if(ctrl&&k==='c'){e.preventDefault();toClip('copy');}
  else if(ctrl&&k==='x'){e.preventDefault();toClip('move');}
  else if(ctrl&&k==='v'){e.preventDefault();paste();}
  else if(e.key==='F2'){e.preventDefault();rename();}
  else if(e.key==='Delete'){e.preventDefault();del();}
  else if(e.key==='F5'){e.preventDefault();load(0);load(1);}
  else if(e.key==='Tab'){e.preventDefault();active=1-active;renderAll();}
  else if(e.key==='Enter'){e.preventDefault();openSel(active);}
  else if(e.key==='Backspace'||(e.altKey&&e.key==='ArrowLeft')){e.preventDefault();back(active);}
  else if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();up(active);}
});

function showLogin(msg){$('login').style.display='flex';$('loginmsg').textContent=msg||'';$('host').focus();}
function start(s){
  $('login').style.display='none';
  panes[0].root=s.root;
  panes.forEach(p=>{p.path=p.root;p.history=[];});
  say('Connected to '+s.host+'. Left: your Force. Right: this PC. Copy or cut on one side, then Paste on the other.');
  load(0);load(1);
}
$('loginform').onsubmit=async e=>{
  e.preventDefault();$('loginmsg').textContent='Connecting…';
  try{start(await api({op:'connect',host:$('host').value.trim(),user:$('user').value.trim()||'root',
    password:$('password').value,root:$('root').value.trim()||'/media'}));}
  catch(err){$('loginmsg').textContent=err.message;}
};
updateClip();
(async()=>{
  try{
    const s=await api({op:'status'});
    if(s.host)$('host').value=s.host; if(s.user)$('user').value=s.user; if(s.root)$('root').value=s.root;
    if(s.connected) start(s); else showLogin(s.message||'');
  }catch(e){showLogin(e.message);}
})();
</script></body></html>
